name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The generated src/<icon>/ files are committed to the repo, so no
      # `build:icons` step is needed (that regenerates src/ from vendored SVGs).
      # `build` below compiles the committed TypeScript src/ to dist/ — REQUIRED
      # before publish: Node/esbuild refuse to type-strip .ts inside node_modules,
      # so the published tarball must ship compiled JS. The `patch-exports` step
      # (run by `build`) rewrites package.json's main/types/exports → dist.

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Run tests
        run: pnpm test -- --run

      - name: Build (compile src → dist)
        run: pnpm build

      - name: Publish @cossackframework/solar-icons
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
